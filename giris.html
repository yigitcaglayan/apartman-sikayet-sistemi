{% extends "base.html" %}

{% block title %}Giriş Yap{% endblock %}

{% block header_title %}Kullanıcı Girişi{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 400px; margin: 40px auto;">
    <h2>Giriş Yap</h2>
    <form method="POST" action="{{ url_for('giris') }}">
        <label for="email">E-posta</label>
        <input type="email" id="email" name="email" required>

        <label for="sifre">Şifre</label>
        <input type="password" id="sifre" name="sifre" required>

        <button type="submit">Giriş Yap</button>
    </form>
    <p style="text-align: center; margin-top: 15px;">
        Hesabınız yok mu? <a href="{{ url_for('kayit') }}">Hemen Kayıt Olun</a>
    </p>
</div>
{% endblock %}
